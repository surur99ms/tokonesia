---
deployment:
  tasks:
    - export REPO=$HOME/repositories/tokonesia
    - export DEPLOYPATH=$HOME/tokonesia.corefive.my.id/

    # 1) Tarik commit terbaru ke repo asli di server.
    #    (cPanel menjalankan tasks ini dari salinan sementara, jadi kita
    #     sebut path repo aslinya secara eksplisit.) Dengan langkah ini,
    #     satu kali "Deploy" = Update from Remote + Deploy sekaligus,
    #     sehingga bisa dipicu otomatis lewat API/GitHub Actions.
    - cd "$REPO" && git fetch -q origin main && git reset -q --hard origin/main

    # 2) Salin ke docroot. Hosting ini tidak punya rsync -> pakai tar.
    #    --no-overwrite-dir  : jangan ubah permission direktori yang sudah ada
    #    --no-same-permissions: mode file ikut umask akun
    #    tar tidak pernah menghapus -> database.php, media/, backup/, tmp/ aman.
    - cd "$REPO" && /bin/tar -cf - --exclude='.git' --exclude='.github' --exclude='.cpanel.yml' --exclude='.gitignore' --exclude='.gitattributes' . | ( cd "$DEPLOYPATH" && /bin/tar -xf - --no-overwrite-dir --no-same-permissions )

    # 3) Pengaman: kunci permission docroot ke 750 (standar cPanel).
    - /bin/chmod 750 "$DEPLOYPATH"

    # 4) JALANKAN OTOMATIS DATABASE MIGRATION
    #    Simpan log hasilnya ke file migration.log agar bisa dicek!
    - /opt/cpanel/ea-php81/root/usr/bin/php $HOME/tokonesia.corefive.my.id/migrate.php migrate > $HOME/tokonesia.corefive.my.id/migration.log 2>&1
